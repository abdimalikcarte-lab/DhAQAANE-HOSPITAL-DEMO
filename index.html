<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARTE HMS – Hospital Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0096C7;--c2:#48CAE4;--grad:linear-gradient(135deg,#0096C7,#48CAE4);--bg:#f1f6fa;--card:#fff;--ink:#0c2233;--mut:#5d7689;--line:#dbe6ee;--sb:#0b2540;--soft:#e3f4fa;--ok:#0f9d6b;--warn:#b7791f;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1620;--card:#11202e;--ink:#e6f1f8;--mut:#8ba6b8;--line:#1f3447;--sb:#06111a;--soft:#0f2d3d;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1620;--card:#11202e;--ink:#e6f1f8;--mut:#8ba6b8;--line:#1f3447;--sb:#06111a;--soft:#0f2d3d;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sb);z-index:60}
.app{display:flex;min-height:100vh}
.sb{width:240px;background:var(--sb);color:#cfe3ee;display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;flex-shrink:0;transition:width .2s;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:16px;color:#fff;font-size:17px}
.mk{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;font-style:normal;flex-shrink:0}
.sb nav{flex:1;padding:6px 10px;overflow-y:auto}
.sb button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#a9c4d4;padding:10px 12px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-align:left;white-space:nowrap}
.sb button:hover{background:rgba(255,255,255,.07)}.sb button.on{background:var(--grad);color:#fff}
.sb svg,.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sbf{padding:10px}
.col .sb{width:68px}.col .sb span{display:none}.col .logo b{display:none}
.mn{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1}
.ibtn{background:var(--soft);border:0;color:var(--c1);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.chip{display:flex;align-items:center;gap:8px;font-size:13px}.av{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800}
.chip small{display:block;color:var(--mut);font-size:11px;line-height:1.1}
main{padding:18px;max-width:1180px;margin:auto}
.scrim{display:none}
@media(max-width:800px){.sb{position:fixed;left:-250px;top:0;padding-top:env(safe-area-inset-top,0px);transition:left .2s;width:240px!important}.col .sb span,.col .logo b{display:inline}.open .sb{left:0}.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}.chip div{display:none}main{padding:12px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.k,.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.k b{display:block;font-size:26px;line-height:1.1}.k span{color:var(--mut);font-size:13px}.k.hero{background:var(--grad);border:0;color:#fff}.k.hero span{color:#e6faff}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:15px}.mut{color:var(--mut);font-size:13px}
svg.ch{width:100%;height:auto;display:block}svg.ch text{fill:var(--mut);font-size:11px;font-family:inherit}svg.ch .v{fill:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.bar{height:6px;border-radius:9px;background:var(--grad);margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{flex:1;min-width:160px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 8px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.btn{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer}.btn.sm{padding:5px 11px;font-size:13px}
.btn.alt{background:var(--soft);color:var(--c1)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.out{background:rgba(192,57,43,.12);color:var(--bad)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border:0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:rgba(15,157,107,.14);color:var(--ok)}.warn{background:rgba(183,121,31,.15);color:var(--warn)}.bad{background:rgba(192,57,43,.14);color:var(--bad)}.inf{background:var(--soft);color:var(--c1)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.cp{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}.cp.on{background:var(--grad);color:#fff;border-color:transparent}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:68px}.bd small{display:block;color:var(--mut)}.bd.oc{background:var(--soft);border-color:var(--c1)}.bd b{font-size:13px}
.dn{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:auto}.dn i{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px}
.f{display:flex;gap:10px;flex-wrap:wrap}.f>div{flex:1;min-width:130px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(440px,93vw)}dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-size:13px;color:var(--mut)}.end{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.lg{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.lg .hero{background:var(--grad);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:12px}.lg .hero h1{font-size:34px;margin:0}
.lg .fm{display:grid;place-items:center;padding:24px}.lc{width:min(380px,100%)}.lc h2{font-size:24px}.err{color:var(--bad);min-height:20px;font-size:13px}.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
@media(max-width:800px){.lg{grid-template-columns:1fr}.lg .hero{padding:28px}.lg .hero h1{font-size:26px}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}#toast.on{opacity:1}
.empty{color:var(--mut);padding:14px 0;text-align:center}
@media print{.sb,.top,.noprint,.scrim{display:none!important}body{background:#fff;color:#000}.k,.p,.tw{border-color:#999}main{max-width:none;padding:0}}
</style></head><body>
<div id="root"></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const IC={dash:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',flask:'<path d="M9 3h6M10 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V3"/>',pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',bed:'<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M2 16h20M6 10V6h6v4"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',pill:'<path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7z"/><path d="m8.5 8.5 7 7"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const ALL=['superadmin','reception','doctor','lab','nurse','pharmacist'],RN={superadmin:'Super Admin',reception:'Receptionist',doctor:'Doctor',lab:'Laboratory',nurse:'Nurse',pharmacist:'Pharmacist'};
const PG={dash:['Dashboard','dash',ALL],patients:['Patients','users',['superadmin','reception','doctor','nurse']],lab:['Laboratory','flask',['superadmin','doctor','lab']],vitals:['Vitals','pulse',['nurse']],pharmacy:['Pharmacy','pill',['superadmin','pharmacist']],wards:['Wards & Beds','bed',['superadmin','reception','nurse']],reports:['Reports','file',['superadmin']],users:['Users','shield',['superadmin']],audit:['Audit log','list',['superadmin']],profile:['Profile','user',ALL]};
const ago=(d,h=0)=>new Date(Date.now()-d*864e5-h*36e5).toISOString(),KEY='carte_hms_demo_v2';
const fdt=t=>new Date(t).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),fd=t=>new Date(t).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
let db,me=null,view='dash',pid=null,col=false,open=false,q='',lf='Pending',ph='Pending';
function seed(){let r=11;const R=n=>{r=(r*9301+49297)%233280;return Math.floor(r/233280*n)};
const d={patients:[],visits:[],labs:[],vitals:[],beds:[],audit:[],meds:[],rxs:[],dxs:[],tests:[],nid:1,users:[{u:'admin',p:'admin123',n:'Dr. Hodan Ali',role:'superadmin',on:1},{u:'reception',p:'rec123',n:'Sahra Nur',role:'reception',on:1},{u:'doctor',p:'doc123',n:'Dr. Abdi Warsame',role:'doctor',on:1},{u:'lab',p:'lab123',n:'Yusuf Farah',role:'lab',on:1},{u:'nurse',p:'nur123',n:'Nurse Amina',role:'nurse',on:1},{u:'pharmacy',p:'pha123',n:'Pharmacist Idil',role:'pharmacist',on:1}]};
['Abdirahman Yusuf Ali','Hodan Ahmed Warsame','Mohamed Ismail Farah','Fadumo Hassan Jama','Ahmed Abdi Osman','Ayaan Mohamud Nur','Khadar Ibrahim Duale','Sahra Abdullahi Egal','Liban Omar Hersi','Ifrah Said Mire','Yasin Hussein Aden','Nasra Elmi Guled','Abdikarim Dahir Samatar','Maryan Jibril Hirsi'].forEach((n,i)=>d.patients.push({id:'P-'+(1001+i),name:n,age:8+R(70),sex:i%2?'Female':'Male',blood:['O+','A+','B+','AB+','O-'][R(5)],phone:'063 4'+(100000+R(899999)),addr:['Hargeisa','Burco','Borama','Berbera','Gabiley'][R(5)],t:ago(R(30)),bed:null}));
const DX=[['Fever and headache','Malaria','Artemether-Lumefantrine, 6 doses'],['Cough and chest pain','Pneumonia','Amoxicillin 500 mg, 3 times daily for 7 days'],['Abdominal pain','Gastritis','Omeprazole 20 mg daily'],['Frequent urination and thirst','Type 2 diabetes','Metformin 500 mg twice daily'],['Headache and dizziness','Hypertension','Amlodipine 5 mg daily'],['Diarrhea and vomiting','Gastroenteritis','ORS and Zinc 20 mg for 10 days'],['Joint pain','Arthritis','Ibuprofen 400 mg when needed']];
for(let i=0;i<26;i++){const x=DX[R(7)];d.visits.push({id:i+1,pid:d.patients[R(14)].id,t:ago(R(7),R(9)),by:'Dr. Abdi Warsame',cc:x[0],dx:x[1],rx:x[2]})}
const T=['Complete blood count','Malaria RDT','Blood glucose','Urinalysis','Liver function','Typhoid test'];
for(let i=0;i<10;i++){const c=R(3)>0;d.labs.push({id:i+1,pid:d.patients[R(14)].id,test:T[R(6)],by:'Dr. Abdi Warsame',t:ago(R(5),R(9)),status:c?'Completed':'Pending',result:c?['Within normal range','Positive','Negative','Elevated'][R(4)]:'',flag:c?['Normal','Abnormal'][R(2)]:''})}
for(let i=0;i<14;i++)d.vitals.push({id:i+1,pid:d.patients[R(14)].id,t:ago(R(4),R(9)),by:'Nurse Amina',bp:['120/80','130/85','110/70','150/95'][R(4)],hr:60+R(55),temp:+(36+R(32)/10).toFixed(1),spo2:92+R(8)});
d.tests=[...T,'Chest X-ray'].map((n,i)=>({id:i+1,name:n,price:[5,3,2,2,8,4,12][i]}));
[['Paracetamol 500 mg','Tablet',400,100,.05],['Amoxicillin 500 mg','Capsule',250,80,.2],['Artemether-Lumefantrine','Tablet',120,60,1.5],['Metformin 500 mg','Tablet',300,100,.08],['Amlodipine 5 mg','Tablet',45,60,.1],['Omeprazole 20 mg','Capsule',200,80,.1],['ORS sachet','Sachet',90,50,.3],['Ibuprofen 400 mg','Tablet',30,80,.07],['Zinc 20 mg','Tablet',150,50,.08],['Ceftriaxone 1 g inj','Vial',25,30,1.2]].forEach((a,i)=>d.meds.push({id:i+1,name:a[0],form:a[1],stock:a[2],min:a[3],price:a[4]}));
for(let i=0;i<7;i++){const m=d.meds[R(10)];d.rxs.push({id:i+1,pid:d.patients[R(14)].id,med:m.name,qty:6+R(20),ins:['1 tablet three times daily','Twice daily after meals','Once daily'][R(3)],by:'Dr. Abdi Warsame',t:ago(R(4),R(9)),status:i<3?'Pending':'Dispensed',disp:i<3?'':'Pharmacist Idil'})}
for(let i=0;i<8;i++){const x=DX[R(7)];d.dxs.push({id:i+1,pid:d.patients[R(14)].id,name:x[1],sev:['Mild','Moderate','Severe'][R(3)],notes:'',by:'Dr. Abdi Warsame',t:ago(R(6),R(9)),status:R(3)?'Active':'Resolved'})}
[['General Ward','G',8],['Maternity','M',5],['ICU','I',4]].forEach(w=>{for(let i=1;i<=w[2];i++)d.beds.push({id:w[1]+i,ward:w[0],pid:null})});
for(let i=0;i<8;i++){const b=d.beds[R(d.beds.length)];if(!b.pid&&!d.patients[i].bed){b.pid=d.patients[i].id;d.patients[i].bed=b.id}}
d.nid=1015;return d}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!db.patients)db=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const lg=m=>{db.audit.unshift({t:new Date().toISOString(),u:me?me.n:'-',role:me?me.role:'',m});db.audit=db.audit.slice(0,120)};
const PT=id=>db.patients.find(p=>p.id===id),pn=id=>PT(id)?PT(id).name:'Removed',is=(...r)=>me&&r.includes(me.role),day=n=>ago(n).slice(0,10);
function form(title,fields,cb,ok='Save'){const d=$('#dlg');d.innerHTML=`<form method="dialog" id="f"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${v==f.v?'selected':''}>${esc(t)}</option>`}).join('')}</select>`:f.a?`<textarea name="${f.k}" rows="3" ${f.r?'required':''}>${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" step="any" ${f.r?'required':''}>`}</label>`).join('')}<div class="end"><button value="x" formnovalidate class="btn ghost">Cancel</button><button class="btn">${ok}</button></div></form>`;d.showModal();$('#f').onsubmit=e=>{if(e.submitter&&e.submitter.value==='x')return;cb(Object.fromEntries(new FormData(e.target)))}}
function info(h){$('#dlg').innerHTML=h+'<div class="end"><button class="btn ghost" onclick="$(\'#dlg\').close()">Close</button></div>';$('#dlg').showModal()}
const Vw={};
Vw.dash=()=>{const T=day(0),vt=db.visits.filter(v=>v.t.slice(0,10)===T).length,oc=db.beds.filter(b=>b.pid).length,pl=db.labs.filter(l=>l.status==='Pending'),pct=Math.round(oc/db.beds.length*100);
const days=[...Array(7)].map((_,i)=>({l:new Date(ago(6-i)).toLocaleDateString('en',{weekday:'short'}),n:db.visits.filter(v=>v.t.slice(0,10)===day(6-i)).length})),mx=Math.max(1,...days.map(d=>d.n));
const dx={};db.visits.forEach(v=>dx[v.dx]=(dx[v.dx]||0)+1);db.dxs.forEach(x=>dx[x.name]=(dx[x.name]||0)+1);const td=Object.entries(dx).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=td[0]?td[0][1]:1;
return`<div class="kpis"><div class="k hero"><b>${db.patients.length}</b><span>Registered patients</span></div><div class="k"><b>${vt}</b><span>Consultations today</span></div><div class="k"><b>${oc}/${db.beds.length}</b><span>Beds occupied</span></div><div class="k"><b style="color:var(--warn)">${pl.length}</b><span>Pending lab tests</span></div><div class="k"><b style="color:var(--warn)">${db.rxs.filter(r=>r.status==='Pending').length}</b><span>Pending prescriptions</span></div></div>
<div class="two"><div class="p"><h3>Consultations, last 7 days</h3><svg class="ch" viewBox="0 0 420 150"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#48CAE4"/><stop offset="1" stop-color="#0096C7"/></linearGradient></defs>${days.map((d,i)=>{const h=d.n/mx*95,x=14+i*58;return`<rect x="${x}" y="${120-h}" width="40" height="${h}" rx="6" fill="url(#g)"/><text x="${x+20}" y="138" text-anchor="middle">${d.l}</text><text x="${x+20}" y="${114-h}" text-anchor="middle" class="v">${d.n}</text>`}).join('')}</svg></div>
<div class="p"><h3>Bed occupancy</h3><div class="dn" style="background:conic-gradient(var(--c1) ${pct}%,var(--line) 0)"><i>${pct}%</i></div><p class="mut" style="text-align:center">${db.beds.length-oc} beds available</p></div></div>
<div class="three"><div class="p"><h3>Top diagnoses</h3>${td.map(t=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(t[0])}</span><b>${t[1]}</b></div><div class="bar" style="width:${t[1]/tm*100}%"></div></div>`).join('')||'<div class="empty">No data</div>'}</div>
<div class="p"><h3>Pending lab orders</h3>${pl.slice(0,5).map(l=>`<div class="row"><span>${esc(l.test)}<br><span class="mut">${esc(pn(l.pid))}</span></span><span class="tag warn">Pending</span></div>`).join('')||'<div class="empty">All results are in.</div>'}</div>
<div class="p"><h3>${is('superadmin')?'Recent activity':'Recent patients'}</h3>${is('superadmin')?db.audit.slice(0,5).map(a=>`<div class="row"><span>${esc(a.m)}<br><span class="mut">${esc(a.u)}</span></span><span class="mut">${fdt(a.t)}</span></div>`).join('')||'<div class="empty">No activity yet.</div>':[...db.patients].reverse().slice(0,5).map(p=>`<div class="row"><span>${esc(p.name)}<br><span class="mut">${p.id}</span></span><span class="mut">${fd(p.t)}</span></div>`).join('')}</div></div>`};
const plist=()=>{const s=q.toLowerCase(),L=db.patients.filter(p=>(p.name+p.id+p.phone).toLowerCase().includes(s));return L.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Patient</th><th>Age / Sex</th><th>Blood</th><th>Status</th><th></th></tr></thead><tbody>${L.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b><div class="mut">${esc(p.phone)}</div></td><td>${p.age} / ${p.sex}</td><td>${p.blood}</td><td>${p.bed?`<span class="tag inf">Admitted · ${p.bed}</span>`:'<span class="tag ok">Outpatient</span>'}</td><td><button class="btn sm" data-a="pview" data-id="${p.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="p empty">No patients found.</div>'};
Vw.patients=()=>`<h2>Patients</h2><div class="tools"><input id="s" placeholder="Search by name, ID or phone" value="${esc(q)}">${is('reception','superadmin')?'<button class="btn" data-a="pnew">Register patient</button>':''}</div><div id="lst">${plist()}</div>`;
Vw.patient=()=>{const p=PT(pid),vs=db.visits.filter(v=>v.pid===pid).reverse(),ls=db.labs.filter(l=>l.pid===pid).reverse(),vt=db.vitals.filter(v=>v.pid===pid).reverse(),dg=db.dxs.filter(x=>x.pid===pid).reverse(),rp=db.rxs.filter(x=>x.pid===pid).reverse();
return`<div class="tools noprint"><button class="btn ghost" data-a="nav" data-v="patients">← Patients</button><span style="flex:1"></span>${is('reception','superadmin')?'<button class="btn alt" data-a="pedit" data-id="'+pid+'">Edit details</button>':''}${is('doctor')?'<button class="btn" data-a="consult" data-id="'+pid+'">New consultation</button><button class="btn alt" data-a="order" data-id="'+pid+'">Order lab test</button><button class="btn alt" data-a="adx" data-id="'+pid+'">Add diagnosis</button><button class="btn alt" data-a="rx" data-id="'+pid+'">Prescribe</button>':''}${is('nurse')?'<button class="btn" data-a="vit" data-id="'+pid+'">Record vitals</button>':''}<button class="btn ghost" data-a="print">Print</button></div>
<div class="p" style="margin-bottom:14px"><div class="row" style="border:0"><div><h2 style="margin:0">${esc(p.name)}</h2><span class="mut">${p.id} · ${p.age} yrs · ${p.sex} · Blood ${p.blood}</span></div>${p.bed?`<span class="tag inf">Admitted · bed ${p.bed}</span>`:'<span class="tag ok">Outpatient</span>'}</div><div class="mut">Phone ${esc(p.phone)} · ${esc(p.addr)} · Registered ${fd(p.t)}${is('nurse')?' · Read-only for nurses':''}</div></div>
<div class="two"><div><div class="p" style="margin-bottom:14px"><h3>Diagnoses</h3>${dg.map(x=>`<div class="row"><span><b>${esc(x.name)}</b> <span class="tag ${x.sev==='Severe'?'bad':x.sev==='Moderate'?'warn':'inf'}">${x.sev}</span><br><span class="mut">${fdt(x.t)} · ${esc(x.by)}${x.notes?' · '+esc(x.notes):''}</span></span>${x.status==='Active'?(is('doctor')?`<button class="btn sm alt" data-a="dres" data-id="${x.id}">Resolve</button>`:'<span class="tag warn">Active</span>'):'<span class="tag ok">Resolved</span>'}</div>`).join('')||'<div class="empty">No diagnoses recorded.</div>'}</div><div class="p" style="margin-bottom:14px"><h3>Prescriptions</h3>${rp.map(x=>`<div class="row"><span><b>${esc(x.med)}</b> × ${x.qty}<br><span class="mut">${esc(x.ins)} · ${fdt(x.t)} · ${esc(x.by)}</span></span><span class="tag ${x.status==='Pending'?'warn':'ok'}">${x.status}</span></div>`).join('')||'<div class="empty">No prescriptions.</div>'}</div><div class="p"><h3>Consultations</h3>${vs.map(v=>`<div class="row" style="display:block"><b>${esc(v.dx)}</b> <span class="mut">· ${fdt(v.t)} · ${esc(v.by)}</span><div>Interview: ${esc(v.cc)}</div><div class="mut">Prescription: ${esc(v.rx)}</div></div>`).join('')||'<div class="empty">No consultations yet.</div>'}</div></div>
<div><div class="p" style="margin-bottom:14px"><h3>Laboratory</h3>${ls.map(l=>`<div class="row"><span>${esc(l.test)}<br><span class="mut">${esc(l.result||'Awaiting result')}</span></span><span class="tag ${l.status==='Pending'?'warn':l.flag==='Abnormal'?'bad':'ok'}">${l.status==='Pending'?'Pending':l.flag}</span></div>`).join('')||'<div class="empty">No lab tests.</div>'}</div>
<div class="p"><h3>Vitals</h3>${vt.slice(0,5).map(v=>`<div class="row"><span>BP ${v.bp} · HR ${v.hr} · ${v.temp}°C · SpO₂ ${v.spo2}%<br><span class="mut">${fdt(v.t)} · ${esc(v.by)}</span></span></div>`).join('')||'<div class="empty">No vitals recorded.</div>'}</div></div></div>`};
Vw.lab=()=>{const L=[...db.labs].reverse().filter(l=>lf==='All'||l.status===lf);
return`<h2>Laboratory</h2><div class="tools">${is('lab')?'<button class="btn" data-a="lnew">Add lab test</button><button class="btn alt" data-a="tnew">Add test type</button>':''}</div><div class="chips">${['Pending','Completed','All','Catalog'].map(c=>`<button class="cp ${lf===c?'on':''}" data-a="lf" data-v="${c}">${c}</button>`).join('')}</div>`+(lf==='Catalog'?`<div class="tw"><table><thead><tr><th>Test</th><th>Price</th></tr></thead><tbody>${db.tests.map(t=>`<tr><td>${esc(t.name)}</td><td>$${t.price.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`:L.length?`<div class="tw"><table><thead><tr><th>Patient</th><th>Test</th><th>Ordered</th><th>Status</th><th>Result</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(pn(l.pid))}<div class="mut">${l.pid}</div></td><td>${esc(l.test)}</td><td>${fdt(l.t)}<div class="mut">${esc(l.by)}</div></td><td><span class="tag ${l.status==='Pending'?'warn':l.flag==='Abnormal'?'bad':'ok'}">${l.status==='Pending'?'Pending':l.flag}</span></td><td>${esc(l.result||'–')}</td><td>${l.status==='Pending'&&is('lab')?`<button class="btn sm" data-a="lres" data-id="${l.id}">Enter result</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="p empty">No tests in this list.</div>')};
const MD=n=>db.meds.find(m=>m.name===n);
Vw.pharmacy=()=>{const W=is('pharmacist');const chips=`<div class="chips">${['Pending','Dispensed','Inventory'].map(c=>`<button class="cp ${ph===c?'on':''}" data-a="phf" data-v="${c}">${c}</button>`).join('')}</div>`;
if(ph==='Inventory')return`<h2>Pharmacy</h2><div class="tools">${W?'<button class="btn" data-a="madd">Add medicine</button>':''}</div>${chips}<div class="tw"><table><thead><tr><th>Medicine</th><th>Form</th><th>Stock</th><th>Price</th><th></th></tr></thead><tbody>${db.meds.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.form}</td><td><b>${m.stock}</b> ${m.stock<=m.min?'<span class="tag bad">Low</span>':''}</td><td>$${m.price.toFixed(2)}</td><td>${W?`<button class="btn sm alt" data-a="mstock" data-id="${m.id}">Restock</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
const L=[...db.rxs].reverse().filter(r=>r.status===ph);
return`<h2>Pharmacy</h2>${chips}${L.length?`<div class="tw"><table><thead><tr><th>Patient</th><th>Medicine</th><th>Qty</th><th>Instructions</th><th>Prescribed</th><th></th></tr></thead><tbody>${L.map(r=>{const m=MD(r.med),ok=m&&m.stock>=r.qty;return`<tr><td>${esc(pn(r.pid))}<div class="mut">${r.pid}</div></td><td>${esc(r.med)}<div class="mut">${m?m.stock+' in stock':'Not in inventory'}</div></td><td>${r.qty}</td><td>${esc(r.ins)}</td><td>${fdt(r.t)}<div class="mut">${esc(r.by)}</div></td><td>${r.status==='Pending'?(W?`<button class="btn sm" data-a="disp" data-id="${r.id}" ${ok?'':'title="Not enough stock"'}>Dispense</button>${ok?'':' <span class="tag bad">Low stock</span>'}`:'<span class="tag warn">Pending</span>'):`<span class="tag ok">Dispensed</span><div class="mut">${esc(r.disp)}</div>`}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="p empty">No prescriptions in this list.</div>'}`};
Vw.vitals=()=>`<h2>Vitals</h2><div class="tools"><button class="btn" data-a="vit">Record vitals</button></div>${db.vitals.length?`<div class="tw"><table><thead><tr><th>Patient</th><th>BP</th><th>Pulse</th><th>Temp</th><th>SpO₂</th><th>Recorded</th></tr></thead><tbody>${[...db.vitals].reverse().slice(0,40).map(v=>`<tr><td>${esc(pn(v.pid))}</td><td>${v.bp}</td><td>${v.hr}${v.hr>110?' <span class="tag bad">High</span>':''}</td><td>${v.temp}°C${v.temp>=38?' <span class="tag bad">Fever</span>':''}</td><td>${v.spo2}%${v.spo2<94?' <span class="tag bad">Low</span>':''}</td><td>${fdt(v.t)}<div class="mut">${esc(v.by)}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="p empty">No vitals recorded.</div>'}`;
Vw.wards=()=>{const W=[...new Set(db.beds.map(b=>b.ward))];return`<h2>Wards & Beds</h2>`+W.map(w=>{const B=db.beds.filter(b=>b.ward===w);return`<div class="p" style="margin-bottom:14px"><div class="row" style="border:0"><h3 style="margin:0">${w}</h3><span class="mut">${B.filter(b=>b.pid).length}/${B.length} occupied</span></div><div class="wg">${B.map(b=>`<button class="bd ${b.pid?'oc':''}" data-a="bed" data-id="${b.id}"><b>${b.id}</b><small>${b.pid?esc(pn(b.pid).split(' ').slice(0,2).join(' ')):'Available'}</small></button>`).join('')}</div></div>`}).join('')};
Vw.reports=()=>{const c=(a,f)=>a.reduce((m,x)=>(m[f(x)]=(m[f(x)]||0)+1,m),{}),g=p=>p.age<5?'0-4':p.age<18?'5-17':p.age<60?'18-59':'60+',sx=c(db.patients,p=>p.sex),ag=c(db.patients,g),dx=c(db.visits,v=>v.dx),lb=c(db.labs,l=>l.status);
const tb=(h,o)=>`<div class="p"><h3>${h}</h3>${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(e=>`<div class="row"><span>${esc(e[0])}</span><b>${e[1]}</b></div>`).join('')}</div>`;
return`<div class="row noprint" style="border:0"><h2>Reports</h2><button class="btn" data-a="print">Print report</button></div><div class="mut" style="margin-bottom:12px">Generated ${fdt(new Date())} · ${esc(me.n)}</div><div class="kpis"><div class="k"><b>${db.patients.length}</b><span>Patients</span></div><div class="k"><b>${db.visits.length}</b><span>Consultations</span></div><div class="k"><b>${db.labs.length}</b><span>Lab tests</span></div><div class="k"><b>${db.beds.filter(b=>b.pid).length}/${db.beds.length}</b><span>Beds occupied</span></div></div><div class="three">${tb('Patients by sex',sx)}${tb('Patients by age group',ag)}${tb('Diagnoses',dx)}${tb('Lab tests by status',lb)}${tb('Prescriptions by status',c(db.rxs,r=>r.status))}</div>`};
Vw.users=()=>`<div class="row noprint" style="border:0"><h2>Users</h2><button class="btn" data-a="uadd">Add user</button></div><div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.n)}</td><td>${esc(u.u)}</td><td>${RN[u.role]}</td><td><span class="tag ${u.on?'ok':'bad'}">${u.on?'Active':'Disabled'}</span></td><td>${u.u===me.u?'':`<button class="btn sm ${u.on?'out':'alt'}" data-a="utog" data-id="${esc(u.u)}">${u.on?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</tbody></table></div>`;
Vw.audit=()=>`<h2>Audit log</h2><div class="p">${db.audit.map(a=>`<div class="row"><span>${esc(a.m)}<br><span class="mut">${esc(a.u)} · ${RN[a.role]||''}</span></span><span class="mut">${fdt(a.t)}</span></div>`).join('')||'<div class="empty">No activity recorded yet.</div>'}</div>`;
Vw.profile=()=>`<h2>Profile</h2><div class="p" style="max-width:520px"><div class="row" style="border:0"><div class="chip"><span class="av">${esc(me.n.replace(/^(Dr\.|Nurse)\s*/,'')[0])}</span><div style="font-size:16px"><b>${esc(me.n)}</b><small>${RN[me.role]} · @${esc(me.u)}</small></div></div></div><div class="end" style="justify-content:flex-start"><button class="btn" data-a="pw">Change password</button><button class="btn alt" data-a="theme">Toggle dark mode</button></div></div>`;
function render(){const R=$('#root');if(!me){R.innerHTML=`<div class="lg"><div class="hero"><span class="mk" style="width:48px;height:48px;font-size:26px;background:rgba(255,255,255,.2)">+</span><h1>CARTE HMS</h1><p style="margin:0;max-width:420px">Patient registration, consultations, laboratory, nursing and bed management in one secure system.</p></div><div class="fm"><div class="lc"><h2>Sign in</h2><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><div class="err" id="le"></div><button class="btn" style="width:100%" data-a="login">Sign in</button><div class="mut" style="margin-top:14px">Demo accounts, tap to fill:</div><div class="demo">${db.users.map(u=>`<button class="btn sm alt" data-a="fill" data-id="${esc(u.u)}">${RN[u.role]}</button>`).join('')}</div></div></div></div>`;return}
if(view!=='patient'&&!PG[view][2].includes(me.role))view=PG.dash[0]&&'dash';
const nav=Object.keys(PG).filter(k=>PG[k][2].includes(me.role)).map(k=>`<button class="${view===k||(view==='patient'&&k==='patients')?'on':''}" data-a="nav" data-v="${k}" title="${PG[k][0]}">${ic(PG[k][1])}<span>${PG[k][0]}</span></button>`).join('');
R.innerHTML=`<div class="app ${col?'col':''} ${open?'open':''}"><aside class="sb"><div class="logo"><i class="mk">+</i><b>CARTE HMS</b></div><nav>${nav}</nav><div class="sbf"><button data-a="logout">${ic('out')}<span>Sign out</span></button></div></aside><div class="scrim" data-a="menu"></div><div class="mn"><header class="top"><button class="ibtn" data-a="menu" aria-label="Toggle menu">${ic('menu')}</button><h1>${view==='patient'?'Patient record':PG[view][0]}</h1><div class="chip"><span class="av">${esc(me.n.replace(/^(Dr\.|Nurse)\s*/,'')[0])}</span><div><b>${esc(me.n)}</b><small>${RN[me.role]}</small></div></div></header><main>${Vw[view]()}</main></div></div>`}
const A={
menu(){if(innerWidth<=800)open=!open;else col=!col;render()},
nav(t){view=t.dataset.v;open=false;q='';render()},
fill(t){const u=db.users.find(x=>x.u===t.dataset.id);$('#lu').value=u.u;$('#lp').value=u.p},
login(){const u=db.users.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);if(!u){$('#le').textContent='Wrong username or password.';return}if(!u.on){$('#le').textContent='This account is disabled.';return}me=u;view=u.role==='lab'?'lab':u.role==='pharmacist'?'pharmacy':'dash';lg('Signed in');save();render()},
logout(){lg('Signed out');me=null;save();render()},
pview(t){pid=t.dataset.id;view='patient';render()},
pnew(){A.pform()},
pedit(t){A.pform(t.dataset.id)},
pform(id){const p=id?PT(id):{};form(id?'Edit patient':'Register patient',[{k:'name',l:'Full name',v:p.name,r:1},{k:'age',l:'Age',t:'number',v:p.age,r:1},{k:'sex',l:'Sex',o:['Female','Male'],v:p.sex},{k:'blood',l:'Blood group',o:['O+','O-','A+','A-','B+','B-','AB+','AB-'],v:p.blood},{k:'phone',l:'Phone',v:p.phone,r:1},{k:'addr',l:'Address',v:p.addr}],d=>{if(id){Object.assign(p,d,{age:+d.age});lg('Edited patient '+id)}else{const n={id:'P-'+(1001+db.patients.length),...d,age:+d.age,t:new Date().toISOString(),bed:null};db.patients.push(n);lg('Registered patient '+n.id+' '+n.name)}save();render();toast('Patient saved')})},
consult(t){const id=t.dataset.id;form('New consultation',[{k:'cc',l:'Patient interview (complaint, history)',a:1,r:1},{k:'dx',l:'Diagnosis',r:1},{k:'rx',l:'Prescription / plan',a:1}],d=>{db.visits.push({id:db.nid++,pid:id,t:new Date().toISOString(),by:me.n,...d});lg('Consultation for '+id);save();render();toast('Consultation saved')})},
order(t){const id=t.dataset.id;form('Order lab test',[{k:'test',l:'Test',o:db.tests.map(t=>t.name)}],d=>{db.labs.push({id:db.nid++,pid:id,test:d.test,by:me.n,t:new Date().toISOString(),status:'Pending',result:'',flag:''});lg(d.test+' ordered for '+id);save();render();toast('Lab test ordered')})},
lres(t){const l=db.labs.find(x=>x.id==t.dataset.id);form('Result: '+esc(l.test),[{k:'result',l:'Result',a:1,r:1},{k:'flag',l:'Interpretation',o:['Normal','Abnormal']}],d=>{Object.assign(l,d,{status:'Completed'});lg('Result entered for '+l.pid);save();render();toast('Result saved')})},
lf(t){lf=t.dataset.v;render()},
adx(t){const id=t.dataset.id;form('Add diagnosis',[{k:'name',l:'Diagnosis',r:1},{k:'sev',l:'Severity',o:['Mild','Moderate','Severe']},{k:'notes',l:'Notes',a:1}],d=>{db.dxs.push({id:db.nid++,pid:id,by:me.n,t:new Date().toISOString(),status:'Active',...d});lg('Diagnosis "'+d.name+'" for '+id);save();render();toast('Diagnosis added')})},
dres(t){const x=db.dxs.find(v=>v.id==t.dataset.id);x.status='Resolved';lg('Resolved diagnosis '+x.name);save();render()},
rx(t){const id=t.dataset.id;form('Prescribe medicine',[{k:'med',l:'Medicine',o:db.meds.map(m=>[m.name,m.name+' ('+m.stock+' in stock)'])},{k:'qty',l:'Quantity',t:'number',v:10,r:1},{k:'ins',l:'Instructions',v:'1 tablet three times daily',r:1}],d=>{db.rxs.push({id:db.nid++,pid:id,med:d.med,qty:+d.qty,ins:d.ins,by:me.n,t:new Date().toISOString(),status:'Pending',disp:''});lg('Prescribed '+d.med+' for '+id);save();render();toast('Prescription sent to pharmacy')},'Prescribe')},
lnew(){form('Add lab test',[{k:'pid',l:'Patient',o:db.patients.map(p=>[p.id,p.name+' ('+p.id+')'])},{k:'test',l:'Test',o:db.tests.map(t=>t.name)},{k:'result',l:'Result (leave empty if still pending)',a:1},{k:'flag',l:'Interpretation',o:['Normal','Abnormal']}],d=>{const done=!!d.result.trim();db.labs.push({id:db.nid++,pid:d.pid,test:d.test,by:me.n,t:new Date().toISOString(),status:done?'Completed':'Pending',result:d.result.trim(),flag:done?d.flag:''});lg(d.test+' added for '+d.pid);save();render();toast('Lab test added')})},
tnew(){form('Add test type',[{k:'name',l:'Test name',r:1},{k:'price',l:'Price ($)',t:'number',r:1}],d=>{if(db.tests.some(x=>x.name.toLowerCase()===d.name.toLowerCase()))return toast('Test already exists');db.tests.push({id:db.nid++,name:d.name,price:+d.price});lg('Added test type '+d.name);save();render();toast('Test type added')})},
phf(t){ph=t.dataset.v;render()},
disp(t){const r=db.rxs.find(x=>x.id==t.dataset.id),m=MD(r.med);if(!m||m.stock<r.qty)return toast('Not enough stock to dispense');m.stock-=r.qty;r.status='Dispensed';r.disp=me.n;lg('Dispensed '+r.med+' for '+r.pid);save();render();toast('Medicine dispensed')},
madd(){form('Add medicine',[{k:'name',l:'Name',r:1},{k:'form',l:'Form',o:['Tablet','Capsule','Syrup','Injection','Vial','Sachet','Cream']},{k:'stock',l:'Stock',t:'number',r:1},{k:'min',l:'Low-stock level',t:'number',v:50},{k:'price',l:'Unit price ($)',t:'number',r:1}],d=>{db.meds.push({id:db.nid++,name:d.name,form:d.form,stock:+d.stock,min:+d.min,price:+d.price});lg('Added medicine '+d.name);save();render()})},
mstock(t){const m=db.meds.find(x=>x.id==t.dataset.id);form('Restock '+esc(m.name),[{k:'q',l:'Quantity received',t:'number',r:1}],d=>{m.stock+=+d.q;lg('Restocked '+m.name+' +'+d.q);save();render()})},

vit(t){const id=t.dataset.id;form('Record vitals',[...(id?[]:[{k:'pid',l:'Patient',o:db.patients.map(p=>[p.id,p.name+' ('+p.id+')'])}]),{k:'bp',l:'Blood pressure',v:'120/80',r:1},{k:'hr',l:'Pulse (bpm)',t:'number',r:1},{k:'temp',l:'Temperature (°C)',t:'number',r:1},{k:'spo2',l:'SpO₂ (%)',t:'number',r:1}],d=>{db.vitals.push({id:db.nid++,pid:id||d.pid,t:new Date().toISOString(),by:me.n,bp:d.bp,hr:+d.hr,temp:+d.temp,spo2:+d.spo2});lg('Vitals for '+(id||d.pid));save();render();toast('Vitals recorded')})},
bed(t){const b=db.beds.find(x=>x.id===t.dataset.id);if(b.pid){const p=PT(b.pid);info(`<h3>Bed ${b.id} · ${b.ward}</h3><p><b>${esc(p.name)}</b><br><span class="mut">${p.id} · ${p.age} yrs · ${p.sex}</span></p><div class="end" style="justify-content:flex-start"><button class="btn alt" data-a="pview" data-id="${p.id}" onclick="$('#dlg').close()">Open record</button>${is('reception','superadmin')?`<button class="btn out" data-a="disch" data-id="${b.id}" onclick="$('#dlg').close()">Discharge</button>`:''}</div>`)}
 else if(is('reception','superadmin')){const free=db.patients.filter(p=>!p.bed);form('Admit to '+b.id+' · '+b.ward,[{k:'pid',l:'Patient',o:free.map(p=>[p.id,p.name+' ('+p.id+')'])}],d=>{b.pid=d.pid;PT(d.pid).bed=b.id;lg('Admitted '+d.pid+' to '+b.id);save();render();toast('Patient admitted')},'Admit')}
 else toast('Bed '+b.id+' is available')},
disch(t){const b=db.beds.find(x=>x.id===t.dataset.id);PT(b.pid).bed=null;lg('Discharged '+b.pid+' from '+b.id);b.pid=null;save();render();toast('Patient discharged')},
uadd(){form('Add user',[{k:'n',l:'Full name',r:1},{k:'u',l:'Username',r:1},{k:'p',l:'Password',r:1},{k:'role',l:'Role',o:ALL.map(r=>[r,RN[r]])}],d=>{if(db.users.some(x=>x.u===d.u))return toast('Username already exists');db.users.push({...d,on:1});lg('Added user '+d.u);save();render()})},
utog(t){const u=db.users.find(x=>x.u===t.dataset.id);u.on=u.on?0:1;lg((u.on?'Enabled ':'Disabled ')+u.u);save();render()},
pw(){form('Change password',[{k:'o',l:'Current password',t:'password',r:1},{k:'n',l:'New password (6+ characters)',t:'password',r:1}],d=>{if(d.o!==me.p)return toast('Current password is wrong');if(d.n.length<6)return toast('Use at least 6 characters');me.p=d.n;lg('Changed password');save();toast('Password changed')})},
theme(){const r=document.documentElement,dk=matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=(r.dataset.theme||(dk?'dark':'light'))==='dark'?'light':'dark'},
print(){window.print()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener('input',e=>{if(e.target.id==='s'){q=e.target.value;$('#lst').innerHTML=plist()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!me&&$('#lp'))A.login()});
render();
</script></body></html>
